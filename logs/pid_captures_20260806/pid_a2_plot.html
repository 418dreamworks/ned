const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function build(){
 document.getElementById('figs').innerHTML='';
 DATA.forEach((leg,gi)=>{
  const fig=document.createElement('div');fig.className='fig';
  fig.innerHTML=`<h2>${leg.name}</h2><div class="leg">
   <b style="color:${css('--xc')}">&#9632; X err</b> &nbsp;
   <b style="color:${css('--yc')}">&#9632; Y err</b> &nbsp;
   <b style="color:${css('--zc')}">&#9632; Z err</b> &nbsp;
   <b style="color:${css('--ac')}">&#9632; A position (lower panel)</b></div>`;
  const cv=document.createElement('canvas');fig.appendChild(cv);
  document.getElementById('figs').appendChild(fig);
  draw(cv,leg);
 });
}
function draw(cv,leg){
 const W=1020,HE=300,HA=110,PAD=46,GAP=26,H=HE+HA+GAP+40;
 const dpr=window.devicePixelRatio||1;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.maxWidth=W+'px';
 const g=cv.getContext('2d');g.scale(dpr,dpr);
 const d=leg.d,t1=d[d.length-1][0];
 const errs=d.flatMap(r=>[r[1],r[2],r[3]]);
 let lo=Math.min(...errs),hi=Math.max(...errs);
 const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
 const alo=Math.min(...d.map(r=>r[4]))-4,ahi=Math.max(...d.map(r=>r[4]))+4;
 const X=t=>PAD+(W-PAD-12)*t/t1;
 const YE=v=>14+(HE-14)*(hi-v)/(hi-lo);
 const YA=v=>HE+GAP+ (HA)*(ahi-v)/(ahi-alo);
 g.font='11px system-ui';
 // grids + labels
 g.strokeStyle=css('--grid');g.fillStyle=css('--muted');g.lineWidth=1;
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=YE(v);
  g.beginPath();g.moveTo(PAD,y);g.lineTo(W-12,y);g.stroke();
  g.fillText(v.toFixed(0)+' um',4,y+4);}
 for(const v of [alo+4,ahi-4]){const y=YA(v);
  g.beginPath();g.moveTo(PAD,y);g.lineTo(W-12,y);g.stroke();
  g.fillText(v.toFixed(0)+' deg',4,y+4);}
 for(let s=0;s<=t1;s+=10){const x=X(s);
  g.beginPath();g.moveTo(x,14);g.lineTo(x,HE+GAP+HA);g.stroke();
  g.fillText(s+'s',x-8,HE+GAP+HA+16);}
 // series
 const cols=[css('--xc'),css('--yc'),css('--zc')];
 for(let si=0;si<3;si++){
  g.strokeStyle=cols[si];g.lineWidth=1.6;g.beginPath();
  d.forEach((r,i)=>{const x=X(r[0]),y=YE(r[si+1]);i?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke();}
 g.strokeStyle=css('--ac');g.lineWidth=1.6;g.beginPath();
 d.forEach((r,i)=>{const x=X(r[0]),y=YA(r[4]);i?g.lineTo(x,y):g.moveTo(x,y);});
 g.stroke();
 // hover
 const tip=document.getElementById('tip');
 cv.onmousemove=ev=>{
  const rc=cv.getBoundingClientRect();
  const t=(ev.clientX-rc.left)*(W/rc.width);
  const tt=(t-PAD)/(W-PAD-12)*t1;
  let bi=0,bd=1e9;
  d.forEach((r,i)=>{const dd=Math.abs(r[0]-tt);if(dd<bd){bd=dd;bi=i;}});
  const r=d[bi];
  tip.style.display='block';tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY+10)+'px';
  tip.innerHTML=`t=${r[0].toFixed(1)}s &nbsp;A=${r[4].toFixed(1)}&deg;<br>X ${r[1].toFixed(0)} &nbsp;Y ${r[2].toFixed(0)} &nbsp;Z ${r[3].toFixed(0)} &micro;m`;
