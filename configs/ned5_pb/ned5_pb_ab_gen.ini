# ============================================================================
#  ned5_pb.ini  --  ned5 REAL-MACHINE config under PROBE BASIC (qtpyvcp).
#  Same iron as ned5_iron.ini: it loads ../ned5/ned5_iron.hal (the real Mesa
#  HAL) and the same ../params/*.inc machine values. Only the GUI layer
#  differs: DISPLAY = probe_basic, postgui_pb.hal, and tools/live/ned_pendant.py
#  (the GUI-independent MPG state machine) instead of the nedgui handler.
#
#  LAUNCH with tools/run5.sh (resume: tools/run5.sh resume) -- probe_basic
#  lives in the qt_pb venv (~/qt_pb/qtpyvcp/venv), which run5.sh puts on PATH.
#
#  The developed machine logic runs GUI-independent from postgui_pb.hal:
#  tools/live/ned_brain.py (head A/C absolute read -> arm -> post-home verify, R4
#  park, stored homing + resume arming, teleop recovery, gui.md event log) and
#  tools/live/ned_pendant.py (MPG pendant state machine).
#
#  Joint map:  0=X  1=Y  2=Z  3=X(gantry twin)  4=A  5=C
# ============================================================================

[EMC]
MACHINE = ned5_pb
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic
THEME_COLOR = dark
ANTIALIAS = true
FPS = 30
CONFIRM_EXIT = False
LOG_FILE = pb.log
# INFO while commissioning: shows the user_tabs/user_dros loader lines, so a
# failed tab/DRO module load is visible instead of silent.
LOG_LEVEL = INFO
PREFERENCE_FILE = pb.pref
CONFIG_FILE = custom_config.yml
POSITION = 0x0
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 2
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
# operator's own controls tab (TOOLPROBE button etc.) -- user_tabs/ned_controls/
# TRAILING SLASH REQUIRED: the loader takes dirname() of this value.
USER_TABS_PATH = user_tabs/
DRO_DISPLAY = XYZAC
GEOMETRY = XYZAC
OFFSET_COLUMNS = XYZACR
TOOL_TABLE_COLUMNS = TPZDR
KEYBOARD_JOG = true
ATC_TAB_DISPLAY = 2
DEFAULT_ANGULAR_VELOCITY = 6
MAX_ANGULAR_VELOCITY = 60
MIN_ANGULAR_VELOCITY = 0.1
MIN_LINEAR_VELOCITY = 0.01
# PB-specific GUI params (as opposed to the iron values in ../params/)
#INCLUDE ned_pb_params.inc
#INCLUDE ../params/display_common.inc

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-code files

[VTK]
ARC_DIVISION = 64
# python backplot instead of the native C++ one -- much faster launch
# (vtk_backplot.py:279 reads this; 0/false = python).
CPP_BACKPLOT = 0

[KINS]
JOINTS = 7
# X gantry (joints 0 & 3) + Y + Z + head A (tilt) + head C (spin). trivkins identity
# is exact while A,C = 0; an A/C-head RTCP kinematics can drop in later (kinstype=B).
KINEMATICS = trivkins coordinates=XYZXACB kinstype=B

[EMCMOT]
#INCLUDE ../params/emcmot.inc

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = ned5_pb.var
# mm startup (Probe Basic's example ships G20 -- this machine is METRIC).
RS274NGC_STARTUP_CODE = F10 S9000 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
ON_ABORT_COMMAND = O<on_abort> CALL
# PB's own subs (probing/util, incl. on_abort) FIRST, then ned's probing ngc,
# then the shared subs. Placed before the #INCLUDE so iniFind returns this one.
SUBROUTINE_PATH = subroutines:../ned5/ngc:../../nc_files/subroutines
# ---- RACK ATC (ported from PB rack_atc_sim 2026-08-01; linear rack, 4
# pockets, positions interpolated from GUI-taught pocket 1+2). M6 runs the
# full swap: park current tool in its fork, fetch the requested one.
# M24/M25 are ned-adapted (sensor-verified drawbar via unclamptool/
# clamptool); M19 orient is REMOVED from m21/m22 (no orient hardware).
REMAP=M6  modalgroup=6 prolog=change_prolog ngc=toolchange epilog=change_epilog
# REMAP=M10 REMOVED 2026-08-02: no carousel on ned, ever (operator).
# P-arg carousel move; called the now-deleted M12
# sub moved to trash/configs/ned5_pb/subroutines/m10.ngc
# REMAP=M11 REMOVED 2026-08-02: no carousel on ned, ever (operator).
# its "M64 P4 (atc motor FWD)" is the CHIP BLOW-OFF on ned
# sub moved to trash/configs/ned5_pb/subroutines/m11.ngc
# REMAP=M12 REMOVED 2026-08-02: no carousel on ned, and stock m12's
# "M64 P3 (atc motor REV)" is the TOOLSETTER DEPLOY on this machine.
# sub moved to trash/configs/ned5_pb/subroutines/m12.ngc
REMAP=M13 modalgroup=6 ngc=m13
REMAP=M21 modalgroup=6 ngc=m21
REMAP=M22 modalgroup=6 ngc=m22
REMAP=M24 modalgroup=6 ngc=m24
REMAP=M25 modalgroup=6 ngc=m25
#INCLUDE ../params/rs274ngc.inc

[PYTHON]
# M6 remap glue (change_prolog/change_epilog) -- ported with the rack ATC
TOPLEVEL = ./python/toplevel.py
PATH_APPEND = ./python/

[ATC]
# Linear rack, 4 forks in a row (operator 2026-08-01). Pocket 1+2 positions,
# rack orientation, Z heights, clearances and traverse speed are configured
# on the Probe Basic ATC setup page (rack-atc-setup.* settings -> params
# 3979-3988); all other pockets interpolate along the pocket1->pocket2 line.
POCKETS = 15

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
# TOOL TABLE = THE DATABASE, not a .tbl file (fixed 2026-08-03).
# custom_config.yml wires the GUI's tooltable plugin to db_tool_table:
# DBToolTable, which reads and writes configs/ned5_pb/tool_table.db. But
# LinuxCNC had no DB_PROGRAM, so it kept loading tool.tbl instead -- two
# disconnected stores. SAVE TABLE really did write the DB and really did
# call load_tool_table(), and LinuxCNC really did reload... the empty .tbl.
# Pressing it more times could never work. Symptom: the GUI showed four
# tools while stat().tool_table held only id -1, so every G43 H<n> failed
# with "Requested tool n not found in the tool table".
# TOOL_TABLE is IGNORED once DB_PROGRAM is set -- left commented as the
# record of what this used to be.
#TOOL_TABLE = tool.tbl
DB_PROGRAM = ./tool_db.sh
TOOL_DB_FILE = tool_table.db
RANDOM_TOOLCHANGER = 0

[HAL]
# REAL Mesa HAL (7I97T + 7I85S + 7I84U) -- the machine layer, GUI-agnostic.
HALFILE = ../ned5/ned5_iron.hal
# -xyzab overlay: workpiece rotary B on 7I85S stepgen.00/01.
HALFILE = ../ned5/ned5_b.hal
HALUI = halui
# PB GUI glue + ned_pendant MPG (runs after probe_basic builds its HAL pins).
POSTGUI_HALFILE = postgui_ab_all.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z X A C B
# Operator-requested (2026-07-30): allow MDI/program run + jogging WITHOUT homing.
NO_FORCE_HOMING = 1
#INCLUDE ../params/traj_common.inc

# Absolute-encoder zero reference and head gear ratios, exposed to HAL so
# postgui can setp pso_live's conversion pins from the SSOT rather than from
# a re-typed literal (CLAUDE.md rule 11).
#INCLUDE ../params/head_zero.inc

[HEAD_GEAR]
#INCLUDE ../params/head_gear.inc

[SPINDLE_0]
#INCLUDE ../params/spindle_0.inc

# ============================================================================
#  AXES  (Cartesian limits/velocities) -- values in ../params/axis_*.inc
# ============================================================================
[AXIS_X]
# GENERATED -xyzab: [AXIS_X] inlined from its .inc with
# MIN_LIMIT/MAX_LIMIT replaced by the driving joint(s)
# bounds, so check_config.tcl passes under trivkins.
MIN_LIMIT = -4042.725
MAX_LIMIT = 1.0
# GENERATED from configs/params/MASTER.params by tools/live/gen_params.py -- DO NOT HAND-EDIT.
# Edit MASTER.params, then run: gen_params.py check && gen_params.py write
# axis_x.inc -- shared [AXIS_X] body (Cartesian limits/velocity). Lifted verbatim
# from configs/ned/ned.ini. #INCLUDE under an [AXIS_X] header.
# MAX_VELOCITY: WRITTEN by tools/live/ned_params.sh (MAX_VEL_LIN) -- edit THERE, never here.
MAX_VELOCITY = 200
MAX_ACCELERATION = 200.0
# LIMITS DISABLED 2026-08-07 (operator: "disable all axis limits for now").
# An axis limit bounds the TOOL TIP, not the carriage; under ned_ac_kins
# the tip sits up to L*(1-cos A) above the joint, so a joint-sized number
# here refused most of Z. Real fix = limits as a function of L_tool.
# The JOINT limits below are untouched and still stop the machine.

[AXIS_Y]
# GENERATED -xyzab: [AXIS_Y] inlined from its .inc with
# MIN_LIMIT/MAX_LIMIT replaced by the driving joint(s)
# bounds, so check_config.tcl passes under trivkins.
MIN_LIMIT = -1787.0
MAX_LIMIT = 1.0
# GENERATED from configs/params/MASTER.params by tools/live/gen_params.py -- DO NOT HAND-EDIT.
# Edit MASTER.params, then run: gen_params.py check && gen_params.py write
# axis_y.inc -- shared [AXIS_Y] body. Lifted verbatim from configs/ned/ned.ini.
# MAX_VELOCITY: WRITTEN by tools/live/ned_params.sh (MAX_VEL_LIN) -- edit THERE, never here.
MAX_VELOCITY = 200
MAX_ACCELERATION = 200.0
# LIMITS DISABLED 2026-08-07 (operator: "disable all axis limits for now").
# An axis limit bounds the TOOL TIP, not the carriage; under ned_ac_kins
# the tip sits up to L*(1-cos A) above the joint, so a joint-sized number
# here refused most of Z. Real fix = limits as a function of L_tool.
# The JOINT limits below are untouched and still stop the machine.

[AXIS_Z]
# GENERATED -xyzab: [AXIS_Z] inlined from its .inc with
# MIN_LIMIT/MAX_LIMIT replaced by the driving joint(s)
# bounds, so check_config.tcl passes under trivkins.
MIN_LIMIT = -620.0
MAX_LIMIT = 1.0
# GENERATED from configs/params/MASTER.params by tools/live/gen_params.py -- DO NOT HAND-EDIT.
# Edit MASTER.params, then run: gen_params.py check && gen_params.py write
# axis_z.inc -- shared [AXIS_Z] body. Lifted verbatim from configs/ned/ned.ini.
MAX_VELOCITY = 169.3
MAX_ACCELERATION = 200.0
# LIMITS DISABLED 2026-08-07 (operator: "disable all axis limits for now").
# An axis limit bounds the TOOL TIP, not the carriage; under ned_ac_kins
# the tip sits up to L*(1-cos A) above the joint, so a joint-sized number
# here refused most of Z. Real fix = limits as a function of L_tool.
# The JOINT limits below are untouched and still stop the machine.

[AXIS_A]
# GENERATED -xyzab: [AXIS_A] inlined from its .inc with
# MIN_LIMIT/MAX_LIMIT replaced by the driving joint(s)
# bounds, so check_config.tcl passes under trivkins.
MIN_LIMIT = -115.0
MAX_LIMIT = 115.0
# GENERATED from configs/params/MASTER.params by tools/live/gen_params.py -- DO NOT HAND-EDIT.
# Edit MASTER.params, then run: gen_params.py check && gen_params.py write
# axis_a.inc -- shared [AXIS_A] body (swivel-head TILT about X/W, degrees).
# A soft limit is DISABLED (see below); JOINT_4 still holds +/-115 deg.
# NOTE: LinuxCNC enforces soft limits only AFTER the axis is homed, and they are
# only ABSOLUTE if home was set to the true head angle -- see docs/gui.md.
MAX_VELOCITY = 30
MAX_ACCELERATION = 2
# LIMITS DISABLED 2026-08-07 (operator: "disable all axis limits for now").
# An axis limit bounds the TOOL TIP, not the carriage; under ned_ac_kins
# the tip sits up to L*(1-cos A) above the joint, so a joint-sized number
# here refused most of Z. Real fix = limits as a function of L_tool.
# The JOINT limits below are untouched and still stop the machine.

[AXIS_C]
# GENERATED -xyzab: [AXIS_C] inlined from its .inc with
# MIN_LIMIT/MAX_LIMIT replaced by the driving joint(s)
# bounds, so check_config.tcl passes under trivkins.
MIN_LIMIT = -315.0
MAX_LIMIT = 315.0
# GENERATED from configs/params/MASTER.params by tools/live/gen_params.py -- DO NOT HAND-EDIT.
# Edit MASTER.params, then run: gen_params.py check && gen_params.py write
# axis_c.inc -- shared [AXIS_C] body (swivel-head SPIN about Z, degrees).
# C soft limit is DISABLED (see below); JOINT_5 still holds +/-315 deg.
# NOTE: enforced only AFTER homing, and absolute only if home = true head angle.
# Bounded (NOT a wrapping/rollover axis) so a +ve->-ve move interpolates through 0.
MAX_VELOCITY = 30
MAX_ACCELERATION = 2
# LIMITS DISABLED 2026-08-07 (operator: "disable all axis limits for now").
# An axis limit bounds the TOOL TIP, not the carriage; under ned_ac_kins
# the tip sits up to L*(1-cos A) above the joint, so a joint-sized number
# here refused most of Z. Real fix = limits as a function of L_tool.
# The JOINT limits below are untouched and still stop the machine.

# ============================================================================
#  JOINTS  (values in ../params/joint_*.inc)
#   0=X gantry side1   1=Y   2=Z   3=X gantry side2   4=A tilt   5=C spin
# ============================================================================
[JOINT_0]
#INCLUDE ../params/joint_x1.inc

[JOINT_1]
#INCLUDE ../params/joint_y.inc

[JOINT_2]
#INCLUDE ../params/joint_z.inc

[JOINT_3]
#INCLUDE ../params/joint_x2.inc

[JOINT_4]
#INCLUDE ../params/joint_a.inc

[JOINT_5]
#INCLUDE ../params/joint_c.inc

# ============================================================================
#  [PSO]  --  Yaskawa absolute-encoder serial read (PktUART). SINGLE SOURCE
#  (ned5_iron.ini is retired to trash/). IFDELAY = 30 bit times: measured
#  sweep 20-40 = one clean 17-byte message; 100 glued ~46 messages silently.
#
#  [PROBE]  --  SINGLE SOURCE for the rod-probing framework (ngc/*.ngc reads
#  #<_ini[probe]NAME>). Full per-value commentary: trash/configs/ned5/
#  ned5_iron.ini lines 138-206.
#  !!! NO INLINE COMMENTS ON VALUE LINES (IniFile number conversion rejects
#  the value -> "Named parameter not defined" aborts) !!!
# ============================================================================
[PSO]
IFDELAY = 30

[PROBE]
RIM_DIA         = 25.4
ROD_DIA         = 9.525
ABOVE           = 5
STANDOFF        = 3
FEED_TOUCH      = 5
FEED_FIND       = 50
RETRACT         = 0.5
FEED_RIM        = 100
SEARCH_DEPTH    = 15
ROD_REACH_L     = 279.4
TARGET_PROJ     = 15.24
RIM_OFFSET      = 2
PHI0            = 0
TILT_LEAN       = 60
C_LEAN          = 0
Y_NEAR          = 5
Y_FAR           = 15
TOL_SLOPE       = 0.002
A_STEP          = 5
MAX_ITER        = 12
N_HEADINGS      = 6

[PUCK]
#INCLUDE ../params/puck.inc

# ===================== GENERATED BY run5.sh -xyzab =====================
# Hand-edits here are destroyed on the next launch. B has no encoder and
# no switches; the worm is self-locking, so it holds unpowered.
[AXIS_B]
MAX_VELOCITY = 120
MAX_ACCELERATION = 30
# No soft limits on B (operator: continuous workpiece rotary).
MIN_LIMIT = -3600000
MAX_LIMIT = 3600000

[JOINT_6]
TYPE = ANGULAR
MAX_VELOCITY = 120
MAX_ACCELERATION = 30
STEPGEN_MAXVEL = 144
STEPGEN_MAXACCEL = 45
# MEASURED 2026-08-11. Nameplate was 22.222 steps/deg (400 p/rev x 20
# worm / 360, docs/components.md:50), but one full turn of the chuck took
# 360.29 deg on the DRO to come back to the mark: 360.29 x 22.222 =
# 8006.364 steps for 360 REAL degrees, so the drivetrain wants
# 8006.364 / 360 = 22.2399 steps/deg. 0.08% off nameplate -- a ratio that
# PASS 2, same day, at 22.2399: 360.12 deg for 360 real. The full
# correction would be 22.2473; the operator asked for HALF of the
# calculated change, so 22.2399 + 0.0074/2 = 22.2436. Halving is right
# while each pass is one revolution judged by eye -- jumping the whole
# way onto a single noisy read overshoots and then oscillates. It
# predicts 360.06 for 360 real next time. If the error does not roughly
# PASS 3, at 22.2436: 359.93 for 360 real -- BELOW 360, so the error
# has CHANGED SIGN. Implied 22.23928; midpoint taken as instructed:
# 22.2414. Readings so far 360.29 / 360.12 / 359.93 now straddle 360,
# which is what running out of signal looks like -- the remaining
# 0.07 deg is 0.02%, at or under what one turn read by eye can
# resolve. Further single-turn passes will wander, not converge. To
# do better, count MANY turns (10 turns puts any reading error over
# 3600 deg instead of 360) or index off something repeatable.
# HALVE, it is not a scale error and rescaling will never fix it.
# is not exactly 20, not a counting error. ONE revolution of evidence:
# re-measure over several turns before trusting it for anything cut.
# The two drives are mechanically mirrored, hence the sign flip.
SCALE = 22.2414
SCALE_MIRROR = -22.2414
FERROR = 5.0
MIN_FERROR = 1.0
MIN_LIMIT = -3600000
MAX_LIMIT = 3600000
# B IS DECLARED WHERE IT STANDS, NOT AT ZERO (operator 2026-08-11: "DO
# NOT home B. I rather keep the work coordinate if MCS is meaningless
# anyway"). B has no switch, no encoder and no index, so a machine zero
# taken fresh each launch lands at a different physical angle every time
# and any G54 offset saved against it is meaningless the next morning.
# [TRAJ]POSITION_FILE already restores joint 6 at startup; the old
# in-place home then overwrote that with 0 and threw it away.
#
# HOME_ABSOLUTE_ENCODER = 2: position := HOME_OFFSET and jump straight to
# HOME_FINISHED -- there is no final move in the state machine at all
# (homing.c:1139-1146), so this cannot turn the chuck. ned_controls sets
# ini.6.home_offset to the RESTORED position immediately before homing,
# which is why HOME_OFFSET here is only the never-run-before default.
# Implies HOME_NO_REHOME (taskintf.cc:326-336), so a re-declare must
# unhome first -- home_b_inplace() does.
HOME = 0.0
HOME_OFFSET = 0.0
HOME_ABSOLUTE_ENCODER = 2
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
# No HOME_SEQUENCE: B stays out of Home All, like A and C.
