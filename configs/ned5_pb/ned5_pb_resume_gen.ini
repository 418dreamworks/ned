# ============================================================================
#  ned5_pb.ini  --  ned5 REAL-MACHINE config under PROBE BASIC (qtpyvcp).
#  Same iron as ned5_iron.ini: it loads ../ned5/ned5_iron.hal (the real Mesa
#  HAL) and the same ../params/*.inc machine values. Only the GUI layer
#  differs: DISPLAY = probe_basic, postgui_pb.hal, and tools/live/ned_pendant.py
#  (the GUI-independent MPG state machine) instead of the nedgui handler.
#
#  LAUNCH with tools/run5.sh (resume: tools/run5.sh resume) -- probe_basic
#  lives in the qt_pb venv (~/qt_pb/qtpyvcp/venv), which run5.sh puts on PATH.
#
#  The developed machine logic runs GUI-independent from postgui_pb.hal:
#  tools/live/ned_brain.py (head A/C absolute read -> arm -> post-home verify, R4
#  park, stored homing + resume arming, teleop recovery, gui.md event log) and
#  tools/live/ned_pendant.py (MPG pendant state machine).
#
#  Joint map:  0=X  1=Y  2=Z  3=X(gantry twin)  4=A  5=C
# ============================================================================

[EMC]
MACHINE = ned5_pb
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = probe_basic
THEME_COLOR = dark
ANTIALIAS = true
FPS = 30
CONFIRM_EXIT = False
LOG_FILE = pb.log
# INFO while commissioning: shows the user_tabs/user_dros loader lines, so a
# failed tab/DRO module load is visible instead of silent.
LOG_LEVEL = INFO
PREFERENCE_FILE = pb.pref
CONFIG_FILE = custom_config.yml
POSITION = 0x0
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 2
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
# operator's own controls tab (TOOLPROBE button etc.) -- user_tabs/ned_controls/
# TRAILING SLASH REQUIRED: the loader takes dirname() of this value.
USER_TABS_PATH = user_tabs/
DRO_DISPLAY = XYZAC
GEOMETRY = XYZAC
OFFSET_COLUMNS = XYZACR
TOOL_TABLE_COLUMNS = TZDR
KEYBOARD_JOG = true
ATC_TAB_DISPLAY = 0
DEFAULT_ANGULAR_VELOCITY = 6
MAX_ANGULAR_VELOCITY = 60
MIN_ANGULAR_VELOCITY = 0.1
MIN_LINEAR_VELOCITY = 0.01
# PB-specific GUI params (as opposed to the iron values in ../params/)
#INCLUDE ned_pb_params.inc
#INCLUDE ../params/display_common.inc

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap G-code files

[VTK]
ARC_DIVISION = 64
# python backplot instead of the native C++ one -- much faster launch
# (vtk_backplot.py:279 reads this; 0/false = python).
CPP_BACKPLOT = 0

[KINS]
JOINTS = 6
# X gantry (joints 0 & 3) + Y + Z + head A (tilt) + head C (spin). trivkins identity
# is exact while A,C = 0; an A/C-head RTCP kinematics can drop in later (kinstype=B).
KINEMATICS = trivkins coordinates=XYZXAC kinstype=B

[EMCMOT]
#INCLUDE ../params/emcmot.inc

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = ned5_pb.var
# mm startup (Probe Basic's example ships G20 -- this machine is METRIC).
RS274NGC_STARTUP_CODE = F10 S1000 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
ON_ABORT_COMMAND = O<on_abort> CALL
# PB's own subs (probing/util, incl. on_abort) FIRST, then ned's probing ngc,
# then the shared subs. Placed before the #INCLUDE so iniFind returns this one.
SUBROUTINE_PATH = subroutines:../ned5/ngc:../../nc_files/subroutines
#INCLUDE ../params/rs274ngc.inc

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
# REAL Mesa HAL (7I97T + 7I85S + 7I84U) -- the machine layer, GUI-agnostic.
HALFILE = ../ned5/ned5_iron.hal
HALUI = halui
# PB GUI glue + ned_pendant MPG (runs after probe_basic builds its HAL pins).
POSTGUI_HALFILE = postgui_pb.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z X A C
# Operator-requested (2026-07-30): allow MDI/program run + jogging WITHOUT homing.
NO_FORCE_HOMING = 1
#INCLUDE ../params/traj_common.inc

[SPINDLE_0]
#INCLUDE ../params/spindle_0.inc

# ============================================================================
#  AXES  (Cartesian limits/velocities) -- values in ../params/axis_*.inc
# ============================================================================
[AXIS_X]
#INCLUDE ../params/axis_x.inc

[AXIS_Y]
#INCLUDE ../params/axis_y.inc

[AXIS_Z]
#INCLUDE ../params/axis_z.inc

[AXIS_A]
#INCLUDE ../params/axis_a.inc

[AXIS_C]
#INCLUDE ../params/axis_c.inc

# ============================================================================
#  JOINTS  (values in ../params/joint_*.inc)
#   0=X gantry side1   1=Y   2=Z   3=X gantry side2   4=A tilt   5=C spin
# ============================================================================
[JOINT_0]
# RESUME overrides (generated by run5.sh resume -- do not hand-edit; first-match-wins
# shadows the #INCLUDE values below): home IN PLACE at ini.N.home_offset, no motion.
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
#INCLUDE ../params/joint_x1.inc

[JOINT_1]
# RESUME overrides (generated by run5.sh resume -- do not hand-edit; first-match-wins
# shadows the #INCLUDE values below): home IN PLACE at ini.N.home_offset, no motion.
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
#INCLUDE ../params/joint_y.inc

[JOINT_2]
# RESUME overrides (generated by run5.sh resume -- do not hand-edit; first-match-wins
# shadows the #INCLUDE values below): home IN PLACE at ini.N.home_offset, no motion.
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
#INCLUDE ../params/joint_z.inc

[JOINT_3]
# RESUME overrides (generated by run5.sh resume -- do not hand-edit; first-match-wins
# shadows the #INCLUDE values below): home IN PLACE at ini.N.home_offset, no motion.
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_USE_INDEX = NO
#INCLUDE ../params/joint_x2.inc

[JOINT_4]
#INCLUDE ../params/joint_a.inc

[JOINT_5]
#INCLUDE ../params/joint_c.inc

# ============================================================================
#  [PSO]  --  Yaskawa absolute-encoder serial read (PktUART). SINGLE SOURCE
#  (ned5_iron.ini is retired to trash/). IFDELAY = 30 bit times: measured
#  sweep 20-40 = one clean 17-byte message; 100 glued ~46 messages silently.
#
#  [PROBE]  --  SINGLE SOURCE for the rod-probing framework (ngc/*.ngc reads
#  #<_ini[probe]NAME>). Full per-value commentary: trash/configs/ned5/
#  ned5_iron.ini lines 138-206.
#  !!! NO INLINE COMMENTS ON VALUE LINES (IniFile number conversion rejects
#  the value -> "Named parameter not defined" aborts) !!!
# ============================================================================
[PSO]
IFDELAY = 30

[PROBE]
RIM_DIA         = 25.4
ROD_DIA         = 9.525
ABOVE           = 5
STANDOFF        = 3
FEED_TOUCH      = 5
FEED_FIND       = 50
RETRACT         = 0.5
FEED_RIM        = 100
SEARCH_DEPTH    = 15
ROD_REACH_L     = 279.4
TARGET_PROJ     = 15.24
RIM_OFFSET      = 2
PHI0            = 0
TILT_LEAN       = 60
C_LEAN          = 0
Y_NEAR          = 5
Y_FAR           = 15
TOL_SLOPE       = 0.002
A_STEP          = 5
MAX_ITER        = 12
N_HEADINGS      = 6

[PUCK]
#INCLUDE ../params/puck.inc
