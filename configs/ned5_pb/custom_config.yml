# example of a machine specific settings
windows:
  mainwindow:
    kwargs:
      confirm_exit: false

data_plugins:
  # DRO TRUTH: report the ENCODER (actual) position, never the commanded one.
  # The plugin DEFAULT is report_actual_pos: False, and nothing set it -- so
  # every DRO showed where motion INTENDED the axis to be. A stalled axis
  # (Z stuck at the bottom of its screw, 2026-08-03) reads as moving on a
  # commanded DRO. INI POSITION_FEEDBACK=ACTUAL only governs LinuxCNC's own
  # display, not qtpyvcp's. Operator 2026-08-04: "always report DRO
  # positions from encoder reads".
  position:
    kwargs:
      report_actual_pos: true

  notifications:
    kwargs:
      # do NOT resurrect old toasts across sessions ("THEY SIMPLY SHOULD NOT
      # SHOW") -- the plugin default persistent=True reloads them on startup
      persistent: false

  tooltable:
    provider: qtpyvcp.plugins.db_tool_table:DBToolTable
    kwargs:
      columns: {{ ini.DISPLAY.tool_table_columns }}
      extras: mill

  offsettable:
    provider: qtpyvcp.plugins.offset_table:OffsetTable
    kwargs:
      columns: {{ ini.DISPLAY.offset_columns }}

settings:

  # VTK backplot view settings

  backplot.show-grid:
    default_value: false

  backplot.show-program-bounds:
    default_value: false

  backplot.show-program-labels:
    default_value: false

  backplot.show-program-ticks:
    default_value: false

  backplot.show-machine-bounds:
    default_value: false

  backplot.show-machine-labels:
    default_value: false

  backplot.show-machine-ticks:
    default_value: false

  backplot.perspective-view:
    default_value: false

  backplot.multitool-colors:
    default_value: True

  rack-atc-setup.user-param-1:
    description: user param label name
    default_value: user param 1 
    persistent: true

  rack-atc-setup.user-param-2:
    description: user param label name
    default_value: user param 2
    persistent: true

  rack-atc-setup.user-param-3:
    description: user param label name
    default_value: user param 3
    persistent: true

  rack-atc-setup.user-param-4:
    description: user param label name
    default_value: user param 4
    persistent: true

  rack-atc-setup.user-param-5:
    description: user param label name
    default_value: user param 5
    persistent: true

  tool-setter-probe.user-param-name-1:
    description: tool setter user param 1
    default_value: user param 1
    persistent: true

  tool-setter-probe.user-param-name-2:
    description: tool setter user param 2
    default_value: user param 2
    persistent: true

  # Clean-slate runtime syntax toggle (single source path only).
  gcode-syntax.on-off:
    description: on off setting for using gcode syntax highlighting in gcode editor
    default_value: true
    persistent: true

# Global editor style defaults moved from QSS.
# Runtime should apply these values so QSS no longer owns editor defaults.
gcode_editor_style_defaults:
  background_color: "{{ '#6c6c6c' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#dfdfdf' }}"
  text_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  padding: 2
  font_family: "Probe Basic Bebas Mono"
  font_point_size: 13
  font_style: normal
  font_weight: 400
  letter_spacing: 0.5
  word_spacing: 2
  border_radius: 4

  line_number_area_background: "{{ '#505050' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#cdcdcd' }}"
  line_number_area_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  line_number_font_family: "Probe Basic Bebas Mono"
  line_number_font_point_size: 11
  line_number_font_weight: 400
  line_number_font_italic: false

  current_line_highlight_enabled: true
  current_line_background: "#6c6ef0"
  current_line_color: "#ffffff"
  find_highlight_background: "#2848b9"
  find_highlight_text: "#ffffff"
  find_error_background: "#ff0000"
  find_error_text: "#ffffff"
  find_status_background: "#5a5a5a"
  find_status_text: "#ffffff"
  find_status_border: "#5f5f5f"

# Runtime-applied syntax profile.
# Single source of truth for token-group highlighting.
# Tokens not listed in syntax_styles use the editor default text color.
gcode_syntax_profile:
  version: 4
  model: flat-token-groups
  source_of_truth: syntax_styles
  note: "Flat color mapping. Add/remove tokens per style; unknown tokens use editor default color."
  default_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  precedence:
    - syntax_styles
  color_resolution_order:
    - group.color
    - setting.default_value
  syntax_styles:
    - id: Syntax_style_1
      setting: gcode-syntax.user-color-1
      color: "{{ '#f0ddb8' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#1a5c9e' }}"
      tokens: [G]

    - id: Syntax_style_2
      setting: gcode-syntax.user-color-2
      color: "{{ '#cce7f8' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#2d5e78' }}"
      tokens: [M]

    - id: Syntax_style_3
      setting: gcode-syntax.user-color-3
      color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#1a1a1a' }}"
      tokens: [X, Y, Z, A, B, C, U, V, W, I, J, K, R, Q, P, F]

    - id: Syntax_style_4
      setting: gcode-syntax.user-color-4
      color: "{{ '#d0f2ff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#2a6890' }}"
      tokens: [number]

    - id: Syntax_style_5
      setting: gcode-syntax.user-color-5
      color: "{{ '#d4dce2' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#8a9898' }}"
      tokens: [semicolon, parenthesis, comment]

    - id: Syntax_style_6
      setting: gcode-syntax.user-color-6
      color: "{{ '#a8cce0' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#2a5a7a' }}"
      tokens: [S, H, T, single_quote, double_quote, string]


# ============================================================================
# MENUBAR OVERRIDE (2026-08-01) -- full copy of probe_basic menubar.yml with
# ONE change: Machine > Homing uses ned's config-owned provider instead of
# qtpyvcp's stock HomingMenu. hiyapyco METHOD_SUBSTITUTE replaces the whole
# key, so the entire menubar must live here. Keep titles paren-free (Jinja
# delims are '(' ')' -- a literal paren in a title crashes config load).
# ============================================================================
menubar:
  - title: File
    items:
    - title: "&Open ..."
      action: win.openFile
      shortcut: ctrl+o

    - title: "&Recent Files"
      provider: qtpyvcp.widgets.recent_files_menu:RecentFilesMenu

    - title: "&Reload"
      action: program.reload

    - title: "&Close"
      action: program.clear

    - title: "Save &As"
      action:

    - separator

    - title: Exit
      action: app.exit
      shortcut: ctrl+q

  - title: Machine
    items:
    - title: Toggle E-Stop
      action: machine.estop.toggle
      shortcut: F1

    - title: Toggle Power
      action: machine.power.toggle
      shortcut: F2

    - title: Shutdown
      action: win.showDialog
      args: [shutdown]

    - separator

    - title: Run Program
      action: program.run
      shortcut: R

    - title: Step
      action: program.step
      shortcut: T

    - title: Pause
      action: program.pause
      shortcut: P

    - title: Resume
      action: program.resume
      shortcut: R

    - title: Abort
      action: program.abort
      shortcut: esc

    - title: Optional Stop
      action: program.optional_stop.toggle

    - title: Optional Skip
      action: program.optional_skip.toggle

    - separator

    - title: Homing
      provider: ned_homing_menu:NedHomingMenu

    - title: Cooling
      items:
        - title: Flood
          action: coolant.flood.toggle
          shortcut: F7

        - title: Mist
          action: coolant.mist.toggle
          shortcut: F8

    - title: Set Work Offsets
      action: win.showDialog
      args: [set_work_offsets]

    - separator

    - title: Override Limits
      action: machine.override_limits

  - title: Settings
    items:
      - title: Show On-screen Keyboard
        action: settings.virtual-input.enable

  - title: View
    items:
      - title: Show Gridlines
        action: settings.backplot.show-grid

      - separator

      - title: Show Machine Bounds
        action: settings.backplot.show-machine-bounds

      - title: Show Machine Labels
        action: settings.backplot.show-machine-labels

      - title: Show Machine Ticks
        action: settings.backplot.show-machine-ticks

      - separator

      - title: Show Program Bounds
        action: settings.backplot.show-program-bounds

      - title: Show Program Labels
        action: settings.backplot.show-program-labels

      - title: Show Program Ticks
        action: settings.backplot.show-program-ticks

      - separator

      - title: Perspective View
        action: settings.backplot.perspective-view

      - title: View Angle
        action: settings.backplot.view

  - title: Tools
    items:
      - title: HAL Meter
        action: tool.halmeter

      - title: HAL Scope
        action: tool.halscope

      - title: HAL Show
        action: tool.halshow

      - title: LCNC Status
        action: tool.status

      - title: Calibration
        action: tool.calibration

      - title: Classicladder PLC
        action: tool.classicladder

      - separator

      - title: "Import Legacy Tool Table [.tbl] ..."
        action: win.showDialog
        args: [import_legacy_tbl]

      - title: "Import Fusion 360 Tool Library [.tools/.json] ..."
        action: win.showDialog
        args: [import_fusion_tools]

      - title: "Import + Merge .tbl and Fusion Library ..."
        action: win.showDialog
        args: [import_merged_tools]

  - title: About
    items:
      - title: About Probe Basic
        action: win.showDialog
        args: [about_probebasic]
      - title: About QtPyVCP
        action: win.showDialog
        args: [about_qtpyvcp]
      - title: About Qt
        action: app.aboutQt
