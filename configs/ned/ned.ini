# ---- Joint 4 : B  (B-axis pair, side 1 -- 7I85S stepgen.00) ----------------
#  Axis B = two SEPARATE steppers ganged as one axis (duplicate B in coordinates):
#  joint 4 = side 1 (stepgen.00), joint 7 = side 2 (stepgen.01). World/axis mode moves
#  axis B and they COUNTER-ROTATE (joint 7 SCALE negative); JOINT mode jogs each alone.
#  Open-loop step/dir -> stepgen POSITION mode, NO PID.
#  SCALE = steps/rev * microstep * gear / 360 = 200*2*20/360 = 22.222 (drive = 400 pulses/rev).
#  SCALE tracks the drive DIP -- change it if you change microstep. HOME_SEQUENCE -3
#  (negative) = synchronized pair homing, matches joint 7.
[JOINT_4]
TYPE = ANGULAR
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 36
STEPGEN_MAXACCEL = 450
SCALE = 22.222
FERROR = 2.0
MIN_FERROR = 1.0
MIN_LIMIT = -3600000
MAX_LIMIT = 3600000                  
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = -3
HOME_USE_INDEX = NO

# ---- Joint 5 : A  (swivel-head TILT, about X/W) ---------------------------
#  Yaskawa SGDXS step/dir -> 7I85S stepgen.02 (open-loop position mode, like B).
#  200:1 worm. SCALE deg = (drive reference-pulses-per-motor-rev x 200) / 360.
#  SCALE 555.556 assumes 1000 pulses/rev electronic gear (Pn20E/Pn210) --
#  UNVERIFIED, must match the drive's actual pulses/rev setting.
#  Immediate home at 0 (HOME_SEARCH_VEL = 0).
[JOINT_5]
TYPE = ANGULAR
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 36
STEPGEN_MAXACCEL = 450
SCALE = 555.556
FERROR = 5.0
MIN_FERROR = 1.0
MIN_LIMIT = -120.0
MAX_LIMIT = 120.0
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 4
HOME_USE_INDEX = NO

# ---- Joint 6 : C  (swivel-head SPIN, about Z) -----------------------------
#  Yaskawa SGDXS step/dir -> 7I85S stepgen.03. Same pattern + SCALE basis as
#  joint 5 (200:1 worm, SCALE UNVERIFIED until the drive pulses/rev is set).
#  Head C travel is +/-360 (user-stated 2026-07-20).
[JOINT_6]
TYPE = ANGULAR
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 36
STEPGEN_MAXACCEL = 450
SCALE = 555.556
FERROR = 5.0
MIN_FERROR = 1.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 5
HOME_USE_INDEX = NO

# ---- Joint 7 : B  (B-axis pair, side 2 -- 7I85S stepgen.01, COUNTER-ROTATES) --
#  Second B stepper, same axis B as joint 4. SCALE is NEGATIVE so it turns opposite
#  to joint 4 for the same B command (between-centers counter-rotation). Own
#  drive/stepgen; mechanically + electrically independent (software-linked only).
[JOINT_7]
TYPE = ANGULAR
MAX_VELOCITY = 30
MAX_ACCELERATION = 300
STEPGEN_MAXVEL = 36
STEPGEN_MAXACCEL = 450
SCALE = -22.222
FERROR = 2.0
MIN_FERROR = 1.0
MIN_LIMIT = -3600000
MAX_LIMIT = 3600000
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = -3
HOME_USE_INDEX = NO
