# ============================================================================
#  ned5.ini  --  5-AXIS case: X, Y, Z, A (head tilt), C (head spin). NO rotary B.
#
#  THIN, PARAMETERIZED config. The actual machine values (limits, scale, PID,
#  home) live in the shared parameterization dir  ../params/*.inc  and are pulled
#  in with #INCLUDE. Edit a value THERE, not here. This file only holds the
#  case-specific structure (joint count, kinematics, coordinates, GUI selection).
#
#  #INCLUDE is expanded by the `linuxcnc` launcher (handle_includes) into
#  ned5.ini.expanded before start; paths are relative to THIS file's directory.
#
#  This case runs the QtVCP "nedgui" screen (ProbeBasic-style) and a SIM loopback
#  HAL (ned5.hal) -- it loads NO Mesa driver and CANNOT move a real axis. It is a
#  self-contained screen/GUI-development config. The real machine config is the
#  untouched configs/ned/ned.ini (DISPLAY = axis); launch that to run the mill.
#  Joint map here:  0=X  1=Y  2=Z  3=X(gantry twin)  4=A  5=C
# ============================================================================

[EMC]
MACHINE = ned5
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = qtvcp nedgui
#INCLUDE ../params/display_common.inc

[KINS]
JOINTS = 6
# X gantry (joints 0 & 3) + Y + Z + head A (tilt) + head C (spin). trivkins identity
# is exact while A,C = 0; an A/C-head RTCP kinematics can drop in later (kinstype=B).
KINEMATICS = trivkins coordinates=XYZXAC kinstype=B

[EMCMOT]
#INCLUDE ../params/emcmot.inc

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = ned5.var
#INCLUDE ../params/rs274ngc.inc

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
# SIM loopback HAL (no Mesa). See ned5.hal header.
HALFILE = ned5.hal
# GUI HAL glue (runs after the screen builds its HAL pins).
POSTGUI_HALFILE = postgui.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z X A C
#INCLUDE ../params/traj_common.inc

[SPINDLE_0]
#INCLUDE ../params/spindle_0.inc

# ============================================================================
#  AXES  (Cartesian limits/velocities) -- values in ../params/axis_*.inc
# ============================================================================
[AXIS_X]
#INCLUDE ../params/axis_x.inc

[AXIS_Y]
#INCLUDE ../params/axis_y.inc

[AXIS_Z]
#INCLUDE ../params/axis_z.inc

[AXIS_A]
#INCLUDE ../params/axis_a.inc

[AXIS_C]
#INCLUDE ../params/axis_c.inc

# ============================================================================
#  JOINTS  (values in ../params/joint_*.inc)
#   0=X gantry side1   1=Y   2=Z   3=X gantry side2   4=A tilt   5=C spin
# ============================================================================
[JOINT_0]
#INCLUDE ../params/joint_x1.inc

[JOINT_1]
#INCLUDE ../params/joint_y.inc

[JOINT_2]
#INCLUDE ../params/joint_z.inc

[JOINT_3]
#INCLUDE ../params/joint_x2.inc

[JOINT_4]
#INCLUDE ../params/joint_a.inc

[JOINT_5]
#INCLUDE ../params/joint_c.inc
