# ============================================================================
#  ned5_iron.ini  --  5-AXIS REAL-MACHINE case: X, Y, Z, A (head tilt), C (head
#  spin). NO rotary B. This is the DRIVE-IRON sibling of ned5.ini:
#  IDENTICAL structure and #INCLUDEs, but it loads the real Mesa HAL
#  (ned5_iron.hal) instead of the SIM loopback (ned5.hal), so it CAN command the
#  real servos. Launch ned5.ini for GUI/screen dev; launch THIS to drive the mill.
#
#  *** Before driving the head: read the ABSOLUTE-HOMING safety blocker in
#      ned5_iron.hal's header. Home A/C only with the head physically at zero and
#      verify a soft limit actually stops it before trusting the +/-115 / +/-315.
#
#  All machine values (limits, scale, PID, home) live in ../params/*.inc -- edit
#  THERE, not here.  Joint map:  0=X  1=Y  2=Z  3=X(gantry twin)  4=A  5=C
# ============================================================================

[EMC]
MACHINE = ned5_iron
VERSION = 1.1
DEBUG = 0

[DISPLAY]
DISPLAY = qtvcp nedgui
#INCLUDE ../params/display_common.inc

[KINS]
JOINTS = 6
# X gantry (joints 0 & 3) + Y + Z + head A (tilt) + head C (spin). trivkins identity
# is exact while A,C = 0; an A/C-head RTCP kinematics can drop in later (kinstype=B).
KINEMATICS = trivkins coordinates=XYZXAC kinstype=B

[EMCMOT]
#INCLUDE ../params/emcmot.inc

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = ned5_iron.var
# Config-local O-word subs (probing framework) FIRST, then the shared subs.
# Placed before the #INCLUDE so this SUBROUTINE_PATH is the one iniFind returns.
SUBROUTINE_PATH = ngc:../../nc_files/subroutines
#INCLUDE ../params/rs274ngc.inc

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
# REAL Mesa HAL (7I97T + 7I85S + 7I84U). See ned5_iron.hal header.
HALFILE = ned5_iron.hal
# GUI HAL glue (runs after the screen builds its HAL pins).
POSTGUI_HALFILE = postgui_iron.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z X A C
# Operator-requested (2026-07-30): allow MDI/program run + jogging WITHOUT homing
# (emctaskmain.cc:2208/2295 gate MDI/Auto on all-homed unless this is set). Unhomed,
# soft limits are relative to power-on zero and hard-limit trips still fault; use
# tools/limits_off.sh for a session with NO limit protection at all.
NO_FORCE_HOMING = 1
#INCLUDE ../params/traj_common.inc

[SPINDLE_0]
#INCLUDE ../params/spindle_0.inc

# ============================================================================
#  AXES  (Cartesian limits/velocities) -- values in ../params/axis_*.inc
# ============================================================================
[AXIS_X]
#INCLUDE ../params/axis_x.inc

[AXIS_Y]
#INCLUDE ../params/axis_y.inc

[AXIS_Z]
#INCLUDE ../params/axis_z.inc

[AXIS_A]
#INCLUDE ../params/axis_a.inc

[AXIS_C]
#INCLUDE ../params/axis_c.inc

# ============================================================================
#  JOINTS  (values in ../params/joint_*.inc)
#   0=X gantry side1   1=Y   2=Z   3=X gantry side2   4=A tilt   5=C spin
# ============================================================================
[JOINT_0]
#INCLUDE ../params/joint_x1.inc

[JOINT_1]
#INCLUDE ../params/joint_y.inc

[JOINT_2]
#INCLUDE ../params/joint_z.inc

[JOINT_3]
#INCLUDE ../params/joint_x2.inc

[JOINT_4]
#INCLUDE ../params/joint_a.inc

[JOINT_5]
#INCLUDE ../params/joint_c.inc

# ============================================================================
#  [PSO]  --  Yaskawa absolute-encoder serial read (PSO on the Mesa PktUART).
#  These describe THIS DRIVE's output format. They are not free choices.
# ============================================================================
[PSO]
# Interframe delay, in BIT TIMES, that the PktUART waits on an idle line before it
# declares a frame finished.
#
# The Yaskawa PSO output (manual 6.12.5) is:
#   17-character ASCII message:  P <sign> <5-digit multiturn> , <8-digit within-turn> CR
#   9600 bps, 7 data bits, EVEN parity, 1 start, 1 stop
#   data output cycle = 40 ms
# So each message takes ~17.7 ms to send, leaving ~22 ms (~211 bit times) of IDLE line
# before the next one. IFDELAY must therefore sit BETWEEN:
#   - the gap between characters WITHIN a message (~0)   -> too small splits mid-message
#   - the ~211 bit-time gap BETWEEN messages             -> too large glues messages together
#
# Measured sweep on this machine:
#   10  -> 1-byte frames   (splits mid-message)
#   20  -> 17-byte frames  (one clean message)  CORRECT
#   40  -> 17-byte frames  (one clean message)  CORRECT
#   100 -> 769-byte frame  (~46 messages glued into one)  <-- WAS THE BUG
#
# 100 failed SILENTLY: no error, no status flag, just unusable oversized frames. It looked
# exactly like a wedged receiver and cost a long hardware hunt. tools/pso_live.comp now raises
# its `oversize` pin and logs loudly if frames exceed 40 bytes, so this cannot recur quietly.
IFDELAY = 30

# ============================================================================
#  [PROBE]  --  SINGLE SOURCE for the rod-probing framework (ngc/*.ngc).
#  Edit values HERE only (CLAUDE.md rule 11); G-code reads #<_ini[probe]NAME>.
#  Tool probe = conductive Bimba (raise M64 P3 / lower M65 P3; trip = motion.probe-input).
#  ALL touches in find_tool_probe / find_a_zero are Z-DOWN (piston never side-loaded).
# ============================================================================
[PROBE]
# !!! NO INLINE COMMENTS ON VALUE LINES IN THIS SECTION !!!
# G-code reads these via #<_ini[probe]NAME>, and IniFile's number conversion REJECTS
# a value line with trailing text: "FEED_TOUCH = 5  # mm/min" made every probe program
# abort with "Named parameter #<_ini[probe]feed_touch> not defined" (bisected 2026-07-30).
# Comments go on their OWN lines, like below.
#
# RIM_DIA: tool-probe rim, EXACT 1 inch diameter (radius 12.7 mm)
RIM_DIA         = 25.4
# ROD_DIA: 3/8" rod
ROD_DIA         = 9.525
# ABOVE: mm, safe height above the top-touch reference
ABOVE           = 5
# STANDOFF: mm, rapid-to margin above an estimated trip before the slow touch
STANDOFF        = 3
# FEED_TOUCH: mm/min, slow precise touch feed (lean + CP1 stage 2)
FEED_TOUCH      = 5
# FEED_FIND: mm/min, CP1 stage-1 contact-find feed (operator-set 2026-07-30)
FEED_FIND       = 50
# RETRACT: mm, back-off between the fast find and the slow accurate re-touch
RETRACT         = 0.5
# FEED_RIM: mm/min, rim-find touch feed. Coarser/faster on purpose: the rim trip-Z isn't
#   known ahead (can't pre-position a 1 mm slow touch) and the center only needs to be
#   ROUGH (to place the lean). Shaft-on-edge is a near-axial load on the piston.
FEED_RIM        = 100
# SEARCH_DEPTH: mm, TOP-probe search depth below the operator start height
SEARCH_DEPTH    = 15
# --- rim-find (Z-DOWN small tilt; tip overshoots the NEAR edge into clear air, SHAFT catches it) ---
#   rim_tilt = asin(TARGET_PROJ / ROD_REACH_L)  -- COMPUTED in find_tool_probe (not hardcoded), so
#   it self-corrects if either length changes.  With these numbers rim_tilt ~ 3.13 deg.
#   Z_touch = Z_top + s_E*cot(rim_tilt);  s_E = (Z_touch - Z_top)*tan(rim_tilt) = dist from spindle
#   axis to the near rim edge along that C heading.  tan(3.13)=0.055 => Z-noise barely moves s_E
#   (sensitive, low-noise), but cot(3.13)=18.3 => the spindle sits ~230 mm ABOVE Z_top at contact
#   and the tip hangs ~50 mm below Z_top in the clear air. REQUIRES ~290 mm of Z travel above the
#   probe top and >~150 mm clear air below -- VERIFY before running.
# ROD_REACH_L: mm, A-axis center-of-rotation to the rod tip (11")
ROD_REACH_L     = 279.4
# TARGET_PROJ: mm, wanted tip horizontal projection (0.6"), ~0.1" past the 12.7 rim.
#   REQUIREMENT: TARGET_PROJ must exceed rim_radius (12.7) + RIM_OFFSET on EVERY C heading,
#   else the tip lands on the flat top (no lateral info). Keep RIM_OFFSET < 15.24-12.7 = 2.54.
TARGET_PROJ     = 15.24
# RIM_OFFSET: mm, +X spindle offset from approx center (MUST be < 2.54). Nonzero so s_E
#   varies with heading -> the touches actually locate the center (at exactly 0 you'd
#   only recover the spindle position).
RIM_OFFSET      = 2
# PHI0: deg, tilt AZIMUTH at C=0 (head convention, unknown). TUNE on machine.
PHI0            = 0
# --- lean / A-zero (Z-down onto the +Y rim edge at two spindle-Y offsets) ---
# TILT_LEAN: deg, A tilt for the lean (near-horizontal = big, sensitive signal)
TILT_LEAN       = 60
# C_LEAN: deg, C value that puts the A-tilt in the Y-Z plane. TUNE.
C_LEAN          = 0
# Y_NEAR/Y_FAR: mm, spindle inside the +Y edge by this for the near/far lean touches
Y_NEAR          = 5
Y_FAR           = 15
# TOL_SLOPE: lean-match tolerance (dimensionless dZ/dY)
TOL_SLOPE       = 0.002
# A_STEP: deg, seed step for the minus-side search
A_STEP          = 5
# MAX_ITER: search cap
MAX_ITER        = 12
# N_HEADINGS: CP2 rim touches (>=3); 6 = 60 deg apart for a good LS circle fit
N_HEADINGS      = 6

# ============================================================================
#  [PUCK]  --  SINGLE SOURCE for THIS tool-probe's location (rule 11).
#  Human-edited seeds; the CP routines can't rewrite an INI, so they log refined
#  values (puck_result.txt) for you to paste back here.
# ============================================================================
[PUCK]
#INCLUDE ../params/puck.inc
